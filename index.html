g",highlights:["Cachoeira das Três Quedas","Escorrega natural","Poço para nado"],mapQuery:"Cachoeira das Três Quedas, Lídice, Rio Claro, RJ, Brasil",coords:"Distrito de Lídice — Rio Claro/RJ",reviews:[{name:"Bárbara Fontes",rating:5,date:"Mai 2025",text:"A Cachoeira das Três Quedas em Lídice é fantástica! A trilha tem alguns trechos íngremes, mas ver as quedas e tomar banho no poço principal recompensa qualquer esforço."},{name:"Thiago Neves",rating:5,date:"Fev 2025",text:"Fomos também na Cachoeira Sebastião Marinho, excelente para relaxar e muito fácil de chegar. Lídice tem cachoeiras incríveis!"}]},{id:"lidice",name:"Lídice",category:"Vila Histórica",district:"Lídice",short:"Charmoso distrito de origem tcheca, com clima de montanha, hortênsias e gastronomia acolhedora.",description:"Lídice é um dos distritos mais charmosos de Rio Claro, batizado em homenagem à vila tcheca de Lidice. Com clima ameno de montanha, ruas floridas de hortênsias, pousadas aconchegantes e uma gastronomia que mistura tradições europeias e mineiras, é um refúgio perfeito para descanso e turismo rural.",image:"/rio-claro-tourism-website--2-/images/lidice.jpg",highlights:["Clima de montanha","Gastronomia rural","Pousadas charmosas"],mapQuery:"Lídice, Rio Claro, RJ, Brasil",coords:"Distrito de Lídice — Rio Claro/RJ",reviews:[{name:"Ana Beatriz",rating:5,date:"Fev 2025",text:"Lugar lindo e tranquilo, com um friozinho gostoso. A comida das pousadas é maravilhosa. Voltarei com certeza!"},{name:"Roberto Lima",rating:5,date:"Dez 2024",text:"Cidade de interior no melhor sentido. Hospitalidade do povo é um capítulo à parte."}]},{id:"sao-joao-marcos",name:"Ruínas de São João Marcos",category:"Patrimônio Histórico",district:"São João Marcos",short:"Sítio histórico da cidade que foi demolida e inundada — um museu a céu aberto.",description:"O Parque Arqueológico e Ambiental de São João Marcos preserva as ruínas da antiga cidade que foi demolida na década de 1940 para a construção de uma represa. Hoje é um emocionante museu a céu aberto, onde é possível caminhar entre os vestígios da igreja matriz, sobrados e ruas, conhecendo a história e a memória da região.",image:"/rio-claro-tourism-website--2-/images/saojoaomarcos.jpg",highlights:["Visita guiada","História viva","Centro de visitantes"],mapQuery:"Parque Arqueológico São João Marcos, Rio Claro, RJ",coords:"Antiga São João Marcos — Rio Claro/RJ",reviews:[{name:"Juliana Martins",rating:5,date:"Abr 2025",text:"Experiência emocionante e educativa. As visitas guiadas contam histórias incríveis sobre a cidade perdida."},{name:"Fernando Alves",rating:4,date:"Nov 2024",text:"Lugar cheio de história e bem cuidado. Recomendo ir com tempo para aproveitar tudo."}]},{id:"represa-lajes",name:"Represa de Ribeirão das Lajes",category:"Lago / Lazer",district:"Lídice / Getulândia",short:"Espelho d'água cercado de montanhas, ótimo para pesca esportiva, passeios de barco e contemplação.",description:"A imensa Represa de Ribeirão das Lajes oferece paisagens deslumbrantes, com suas águas calmas refletindo as montanhas verdes ao redor. É um local procurado para pesca esportiva, passeios de barco, esportes náuticos e momentos de paz à beira d'água, com diversos recantos e pousadas no entorno.",image:"/rio-claro-tourism-website--2-/images/represa.jpg",highlights:["Passeio de barco","Pesca esportiva","Pôr do sol incrível"],mapQuery:"Represa de Ribeirão das Lajes, Rio Claro, RJ",coords:"Ribeirão das Lajes — Rio Claro/RJ",reviews:[{name:"Patrícia Gomes",rating:5,date:"Mar 2025",text:"Vista de tirar o fôlego! Fizemos um passeio de barco ao entardecer e foi inesquecível."},{name:"Diego Santos",rating:4,date:"Out 2024",text:"Ótimo para relaxar e pescar. Lugar amplo e bonito, leve protetor solar."}]},{id:"trilha-pico",name:"Trilhas da Serra do Mar",category:"Ecoturismo / Aventura",district:"Rio Claro",short:"Trilhas e mirantes na Serra do Mar com vistas panorâmicas dos vales e da Mata Atlântica.",description:"Para os amantes de aventura, as trilhas da Serra do Mar em Rio Claro revelam mirantes com vistas panorâmicas de tirar o fôlego. Entre matas preservadas, riachos e formações rochosas, os percursos levam a picos onde se descortinam vales verdejantes e mares de nuvens, ideais para o ecoturismo e a fotografia.",image:"/rio-claro-tourism-website--2-/images/trilha.jpg",highlights:["Mirantes panorâmicos","Observação de aves","Aventura na natureza"],mapQuery:"Serra do Mar, Rio Claro, RJ, Brasil",coords:"Serra do Mar — Rio Claro/RJ",reviews:[{name:"Lucas Pereira",rating:5,date:"Fev 2025",text:"A subida cansa, mas a vista no topo recompensa demais. Natureza preservada e ar puro!"},{name:"Camila Rocha",rating:5,date:"Jan 2025",text:"Trilha bem sinalizada e paisagens incríveis. Recomendo guia local para conhecer melhor a região."}]},{id:"getulandia",name:"Getulândia e Turismo Rural",category:"Turismo Rural",district:"Getulândia",short:"Distrito tranquilo com fazendas, cafés coloniais e o autêntico estilo de vida do interior fluminense.",description:"Getulândia é o coração do turismo rural de Rio Claro. Por entre estradas de terra e paisagens bucólicas, o visitante encontra fazendas históricas, produção artesanal, cafés coloniais fartos e a hospitalidade genuína do interior fluminense. Um convite a desacelerar e viver o ritmo do campo.",image:"/rio-claro-tourism-website--2-/images/getulandia.jpg",highlights:["Café colonial","Fazendas históricas","Vida no campo"],mapQuery:"Getulândia, Rio Claro, RJ, Brasil",coords:"Distrito de Getulândia — Rio Claro/RJ",reviews:[{name:"Sandra Oliveira",rating:5,date:"Mar 2025",text:"Paz total! O café colonial é maravilhoso e as pessoas super acolhedoras. Recomendo demais."},{name:"Marcelo Dias",rating:4,date:"Set 2024",text:"Lugar perfeito para fugir da correria. Paisagens lindas e tranquilidade de sobra."}]},{id:"passa-tres",name:"Distrito de Passa Três",category:"Vila Histórica",district:"Passa Três",short:"Charmoso e histórico distrito, conhecido pelo seu clima bucólico, arquitetura colonial e a tradicional Festa da União.",description:"Passa Três é um distrito acolhedor de Rio Claro, com ruas tranquilas, praças arborizadas e construções históricas remanescentes da época áurea do café. O local atrai visitantes pelo seu clima pacato de interior, sua rica gastronomia típica que valoriza os produtores locais e eventos comunitários tradicionais, como a famosa Festa da União.",image:"/rio-claro-tourism-website--2-/images/passatres.jpg",highlights:["Arquitetura Colonial","Clima Bucólico","Festa da União"],mapQuery:"Passa Três, Rio Claro, RJ, Brasil",coords:"Distrito de Passa Três — Rio Claro/RJ",reviews:[{name:"Carlos Mendes",rating:5,date:"Jun 2025",text:"Distrito muito aconchegante! Paramos para almoçar e fomos super bem recebidos. A arquitetura preserva muito a história do ciclo do café."},{name:"Mariana Souza",rating:4,date:"Mai 2025",text:"Lugar calmo e ótimo para tirar fotos. A Festa da União é excelente e muito animada!"}]},{id:"fazenda-sao-joaquim",name:"Fazenda São Joaquim da Grama",category:"Patrimônio Histórico",district:"Passa Três",short:"Antiga sede do 'Rei do Café' com casarão imperial e capela histórica de 1887.",description:"A Fazenda São Joaquim da Grama foi uma das propriedades mais importantes do comendador Joaquim José de Souza Breves, o lendário 'Rei do Café' no século XIX. O imponente casarão colonial e a histórica Capela de São Joaquim, erguida em 1887 e tombada pelo Inepac, são marcos de valor inestimável da memória imperial e cafeeira do Sul Fluminense.",image:"/rio-claro-tourism-website--2-/images/saojoaquim.png",highlights:["Capela de 1887","História Imperial","Barões do Café"],mapQuery:"Fazenda São Joaquim da Grama, Rio Claro, RJ, Brasil",coords:"Passa Três — Rio Claro/RJ",reviews:[{name:"Julio Cesar",rating:4,date:"Abr 2025",text:"Uma viagem no tempo. A capela histórica é impressionante e cheia de detalhes da época do império."},{name:"Aline Costa",rating:5,date:"Mar 2025",text:"Um patrimônio histórico riquíssimo que merece ser preservado e visitado por todos que gostam de história."}]},{id:"trilhas-motocross",name:"Trilhas de Motocross e Off-Road",category:"Ecoturismo / Aventura",district:"Rio Claro",short:"Rotas desafiadoras e trilhas em meio à Serra do Mar para entusiastas de motos e esportes de aventura.",description:"Rio Claro é um destino muito procurado por praticantes de motocross, trilhas de moto e jipes. Aproveitando o relevo montanhoso da Serra do Mar e estradas de terra cercadas por densa vegetação, o município oferece percursos cheios de adrenalina, lama, subidas íngremes e visuais deslumbrantes.",image:"/rio-claro-tourism-website--2-/images/motocross.png",highlights:["Trilhas técnicas","Esportes Radicais","Off-Road na Serra"],mapQuery:"Serra do Mar, Rio Claro, RJ, Brasil",coords:"Serra do Mar — Rio Claro/RJ",reviews:[{name:"Rodrigo Silva",rating:5,date:"Mai 2025",text:"As trilhas de Rio Claro são sensacionais! Muita lama, desafios técnicos e um visual incrível da Serra do Mar lá de cima."},{name:"Gustavo Abreu",rating:5,date:"Fev 2025",text:"Sempre reunimos a galera para fazer o circuito off-road da região. O relevo favorece demais a prática do motocross."}]}];const Vf=(...h)=>h.filter((_,E,f)=>!!_&&_.trim()!==""&&f.indexOf(_)===E).join(" ").trim();const zh=h=>h.replace(/([a-z0-9])([A-Z])/g,"$1-$2").toLowerCase();const Ah=h=>h.replace(/^([A-Z])|[\s-_]+(\w)/g,(_,E,f)=>f?f.toUpperCase():E.toLowerCase());const Qf=h=>{const _=Ah(h);return _.charAt(0).toUpperCase()+_.slice(1)};var Tc={xmlns:"http://www.w3.org/2000/svg",width:24,height:24,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"};const wh=h=>{for(const _ in h)if(_.startsWith("aria-")||_==="role"||_==="title")return!0;return!1},Th=q.createContext({}),Eh=()=>q.useContext(Th),Mh=q.forwardRef(({color:h,size:_,strokeWidth:E,absoluteStrokeWidth:f,className:O="",children:D,iconNode:Y,...G},w)=>{const{size:y=24,strokeWidth:C=2,absoluteStrokeWidth:U=!1,col  e energia.",details:"A demolição foi implacável para evitar que moradores retornassem. Casarões coloniais, duas igrejas históricas e pontes foram colocados abaixo. O sofrimento das famílias desabrigadas marcou a memória coletiva. Sob as águas da represa, ficou submerso um dos mais valiosos patrimônios do período imperial.",icon:"💧"},{year:"Hoje",title:"Resgate Histórico e Preservação",description:"Hoje, Rio Claro valoriza sua história. Em 2011, foi inaugurado o Parque Arqueológico de São João Marcos, o primeiro parque arqueológico a céu aberto do país. As ruínas resgatadas da igreja matriz, ruas de pedra e casarões servem como um espaço de educação ambiental, turismo histórico e orgulho para a população local.",details:"Patrocinado pela Light e gerido em parceria com o Inepac, o parque arqueológico resgatou as fundações da antiga Matriz, o calçamento original de pedras e vestígios de residências. O espaço conta com passarelas suspensas, centro de memória com maquetes e anfiteatro, tornando-se o principal marco de turismo histórico da região.",icon:"🌿"}];return s.jsxs("section",{id:"historia",className:"bg-emerald-950 py-20 text-white relative overflow-hidden",children:[s.jsx("div",{className:"absolute top-0 left-0 w-64 h-64 bg-emerald-800/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"}),s.jsx("div",{className:"absolute bottom-0 right-0 w-80 h-80 bg-emerald-900/20 rounded-full blur-3xl translate-x-1/3 translate-y-1/3"}),s.jsxs("div",{className:"relative z-10 mx-auto max-w-5xl px-5",children:[s.jsxs("div",{className:"text-center mb-16",children:[s.jsx("span",{className:"text-sm font-bold uppercase tracking-wider text-emerald-400",children:"Nossa Trajetória"}),s.jsx("h2",{className:"mt-2 text-3xl font-extrabold sm:text-4xl",children:"A História de Rio Claro"}),s.jsx("p",{className:"mx-auto mt-4 max-w-2xl text-emerald-100/80 text-base",children:"De próspera capital do café a patrimônio histórico submerso, conheça a jornada que moldou a identidade de nossa
